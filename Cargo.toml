[workspace]
members = ["crates/contracts/kernel", "crates/contracts/context", "crates/contracts/agent", "crates/runtime/execution", "crates/runtime/agent", "crates/platform/diagnostics", "crates/floe-agent", "crates/floe-core", "crates/floe-domain", "crates/modules/access", "crates/modules/day", "crates/modules/connections", "crates/modules/inference", "crates/floe-ffi", "crates/floe-infra", "crates/floe-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
turso = { version = "0.8.0-pre.7", default-features = false, features = ["fts"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v5"] }
