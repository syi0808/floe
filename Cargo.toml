[workspace]
members = [
    "crates/contracts/kernel",
    "crates/contracts/model",
    "crates/contracts/context",
    "crates/contracts/agent",
    "crates/contracts/conversation",
    "crates/runtime/execution",
    "crates/runtime/agent",
    "crates/modules/conversation-core",
    "crates/modules/a2a",
    "crates/platform/diagnostics",
    "crates/platform/native",
    "crates/modules/access",
    "crates/modules/actions",
    "crates/modules/connections",
    "crates/modules/context",
    "crates/modules/conversation",
    "crates/modules/day",
    "crates/modules/experts",
    "crates/modules/inference",
    "crates/modules/knowledge",
    "crates/experts/builtin",
    "crates/adapters/providers",
    "crates/adapters/vault",
    "crates/app",
    "crates/bindings/protocol",
    "crates/bindings/ffi",
]
resolver = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = 0
opt-level = 1

[profile.debugging]
inherits = "dev"
debug = "full"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
jsonschema = { version = "0.55.1", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
turso = { version = "0.8.0-pre.7", default-features = false }
uuid = { version = "1.26.0", features = ["serde", "v4", "v5"] }
