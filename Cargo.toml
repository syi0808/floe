[workspace]
members = ["crates/floe-core", "crates/floe-domain", "crates/floe-ffi", "crates/floe-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
turso = "0.8.0-pre.7"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
