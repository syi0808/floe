name: floe_client
description: "Floe's calm, local-first personal day client."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number. Both the version and the builder number
# may be overridden using Flutter's --build-name and --build-number options.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  cupertino_icons: ^1.0.8
  ffi: ^2.2.0
  path_provider: ^2.1.6
  figma_squircle: ^0.6.3
  lucide_icons_flutter: ^3.1.17
  flutter_svg: ^2.3.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/floe-mascot.svg
    - assets/floe-mascot-body.svg
    - assets/floe-mascot-eyes.svg
    - assets/fonts/OFL.txt

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
