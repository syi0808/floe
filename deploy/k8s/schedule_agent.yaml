apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schedule-agent
  template:
    metadata:
      labels:
        app: schedule-agent
    spec:
      containers:
        - name: schedule-agent
          image: schedule-agent:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: schedule-agent
spec:
  selector:
    app: schedule-agent
  ports:
    - port: 8000
      targetPort: 8000
