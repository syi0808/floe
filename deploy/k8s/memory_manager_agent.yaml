apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory_manager-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory_manager-agent
  template:
    metadata:
      labels:
        app: memory_manager-agent
    spec:
      containers:
        - name: memory_manager-agent
          image: memory_manager-agent:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: memory_manager-agent
spec:
  selector:
    app: memory_manager-agent
  ports:
    - port: 8000
      targetPort: 8000
