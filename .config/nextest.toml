[test-groups]
native = { max-threads = 1 }
server = { max-threads = 1 }
database-heavy = { max-threads = 4 }

[profile.default]
test-threads = 8
retries = 0

[[profile.default.overrides]]
filter = 'binary(native_calendar) | test(vault_host::tests::native_actions::) | package(floe-native) | binary(c_abi)'
test-group = 'native'

[[profile.default.overrides]]
filter = 'binary(live_server_access)'
test-group = 'server'

[[profile.default.overrides]]
filter = 'package(floe-app) | package(floe-vault) | package(floe-provider-adapters)'
test-group = 'database-heavy'
