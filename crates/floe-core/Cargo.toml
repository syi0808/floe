[package]
name = "floe-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
floe-domain = { path = "../floe-domain" }
floe-agent = { path = "../floe-agent" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
turso.workspace = true
uuid.workspace = true
tokio.workspace = true
getrandom = "0.3.4"
subtle = "2.6.1"
zeroize = "1.9.0"
keyring-core = "1.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["protected"] }

[dev-dependencies]
tempfile = "3.23.0"
