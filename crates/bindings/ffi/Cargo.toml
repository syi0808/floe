[package]
name = "floe-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["os-keyring"]
os-keyring = ["floe-app/os-keyring"]
development-storage = ["floe-app/development-storage"]
qa-fixtures = ["development-storage", "floe-app/qa-fixtures"]

[dependencies]
chrono.workspace = true
floe-app = { path = "../../app", default-features = false }
floe-protocol = { path = "../protocol" }
floe-conversation = { path = "../../modules/conversation" }
floe-connections = { path = "../../modules/connections" }
floe-access = { path = "../../modules/access" }
floe-context = { path = "../../modules/context" }
floe-day = { path = "../../modules/day" }
floe-calendar-operations = { path = "../../modules/calendar_operations" }
floe-experts = { path = "../../modules/experts" }
floe-knowledge = { path = "../../modules/knowledge" }
floe-execution = { path = "../../runtime/execution" }
floe-kernel = { path = "../../contracts/kernel" }
floe-agent-contract = { path = "../../contracts/agent" }
floe-context-contract = { path = "../../contracts/context" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
