[package]
name = "floe-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
floe-access = { path = "../modules/access" }
floe-actions = { path = "../modules/actions" }
floe-agent-contract = { path = "../contracts/agent" }
floe-connections = { path = "../modules/connections" }
floe-context = { path = "../modules/context" }
floe-context-contract = { path = "../contracts/context" }
floe-conversation = { path = "../modules/conversation" }
floe-day = { path = "../modules/day" }
floe-diagnostics = { path = "../platform/diagnostics" }
floe-execution = { path = "../runtime/execution" }
floe-experts = { path = "../modules/experts" }
floe-experts-builtin = { path = "../experts/builtin" }
floe-inference = { path = "../modules/inference" }
floe-kernel = { path = "../contracts/kernel" }
floe-knowledge = { path = "../modules/knowledge" }
floe-provider-adapters = { path = "../adapters/providers" }
floe-vault = { path = "../adapters/vault" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
# The keyring smoke example drives this host against a real Keychain.
keyring-core = "1.0.0"
zeroize = "1.9.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.177"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = [
    "keychain",
] }
