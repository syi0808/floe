[package]
name = "floe-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["os-keyring"]
os-keyring = ["dep:keyring-core", "dep:apple-native-keyring-store"]
development-storage = []

[dependencies]
base64 = "0.22.1"
chrono.workspace = true
floe-access = { path = "../../modules/access" }
floe-actions = { path = "../../modules/actions" }
floe-agent-contract = { path = "../../contracts/agent" }
floe-context = { path = "../../modules/context" }
floe-context-contract = { path = "../../contracts/context" }
floe-connections = { path = "../../modules/connections" }
floe-conversation = { path = "../../modules/conversation" }
floe-day = { path = "../../modules/day" }
floe-execution = { path = "../../runtime/execution" }
floe-experts = { path = "../../modules/experts" }
floe-kernel = { path = "../../contracts/kernel" }
floe-knowledge = { path = "../../modules/knowledge" }
getrandom = "0.3.4"
keyring-core = { version = "1.0.0", optional = true }
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6.1"
thiserror.workspace = true
tokio.workspace = true
turso.workspace = true
uuid.workspace = true
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true, default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true, default-features = false, features = ["protected"] }
