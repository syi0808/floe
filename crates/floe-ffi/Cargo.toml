[package]
name = "floe-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
chrono.workspace = true
floe-core = { path = "../floe-core" }
floe-agent = { path = "../floe-agent" }
floe-diagnostics = { path = "../platform/diagnostics" }
floe-domain = { path = "../floe-domain" }
floe-infra = { path = "../floe-infra" }
floe-knowledge = { path = "../modules/knowledge" }
floe-context = { path = "../modules/context" }
floe-protocol = { path = "../floe-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
zeroize = "1.9.0"

[dev-dependencies]
floe-inference = { path = "../modules/inference" }
ring = "0.17.14"
tempfile = "3.23.0"
