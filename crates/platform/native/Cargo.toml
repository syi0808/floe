[package]
name = "floe-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
floe-context-contract = { path = "../../contracts/context" }
floe-execution = { path = "../../runtime/execution" }
floe-kernel = { path = "../../contracts/kernel" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = "0.10.1"
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }
